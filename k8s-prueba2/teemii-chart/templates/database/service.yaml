{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.serviceName }}
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: teemii-db
  ports:
    - port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
{{- end }}