{{- if .Values.database.enabled }}
{{- $password := .Values.database.password }}
{{- if not $password }}
  {{- $existente := lookup "v1" "Secret" .Release.Namespace "teemii-db-secret" }}
  {{- if $existente }}
    {{- $password = index $existente.data "password" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 20 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: teemii-db-secret
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.database.user | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}