apiVersion: apps/v1
kind: Deployment
metadata:
  name: teemii-frontend
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
    app: teemii-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: teemii-frontend
  template:
    metadata:
      labels:
        app: teemii-frontend
      {{- if .Values.frontend.customNginx.enabled }}
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      containers:
        - name: teemii-frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
          env:
            - name: BACKEND_URL
              value: {{ .Values.backend.url | quote }}
          {{- if .Values.frontend.customNginx.enabled }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          {{- end }}
      {{- if .Values.frontend.customNginx.enabled }}
      volumes:
        - name: nginx-conf
          configMap:
            name: teemii-frontend-nginx
      {{- end }}