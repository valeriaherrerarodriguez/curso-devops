{{- if .Values.frontend.customNginx.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: teemii-frontend-nginx
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
data:
  default.conf: |
    # Configuración opcional de nginx; el proxy al backend usa .Values.backend.url
    server {
      listen {{ .Values.frontend.containerPort }};
      root /usr/share/nginx/html;
      location / {
        try_files $uri /index.html;
      }
      location /api/ {
        proxy_pass {{ .Values.backend.url }};
      }
    }
{{- end }}