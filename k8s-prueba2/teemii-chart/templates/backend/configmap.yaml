apiVersion: v1
kind: ConfigMap
metadata:
  name: teemii-backend-config
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.backend.port | quote }}
  {{- range $clave, $valor := .Values.backend.env }}
  {{ $clave }}: {{ $valor | quote }}
  {{- end }}
  {{- if .Values.database.enabled }}
  DB_HOST: {{ .Values.database.serviceName | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  {{- end }}