apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teemii-data
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backend.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.size }}