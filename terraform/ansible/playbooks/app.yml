---
- name: Configure Application Tier
  hosts: tier_App
  become: true

  tasks:
    - name: Verify Python
      ansible.builtin.command:
        cmd: python3 --version
      changed_when: false

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/myapp
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Deploy application
      ansible.builtin.copy:
        dest: /opt/myapp/app.py
        owner: ubuntu
        group: ubuntu
        mode: "0644"
        content: |
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import socket

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  message = (
                      "Application Tier funcionando\n"
                      f"Servidor: {socket.gethostname()}\n"
                  )

                  body = message.encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.end_headers()
                  self.wfile.write(body)

          HTTPServer(
              ("0.0.0.0", 8080),
              Handler
          ).serve_forever()

      notify:
        - Restart Application

    - name: Create systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/myapp.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=DevOps Challenge Application
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/opt/myapp
          ExecStart=/usr/bin/python3 /opt/myapp/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

      notify:
        - Reload systemd
        - Restart Application

    - name: Ensure application is running
      ansible.builtin.systemd:
        name: myapp
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Application
      ansible.builtin.systemd:
        name: myapp
        state: restarted