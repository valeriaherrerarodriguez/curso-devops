apiVersion: apps/v1
kind: Deployment
metadata:
  name: teemii-frontend
  namespace: teemii
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teemii-frontend
  template:
    metadata:
      labels:
        app: teemii-frontend
    spec:
      containers:
        - name: teemii-frontend
          image: dokkaner/teemii-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: teemii-frontend
  namespace: teemii
spec:
  type: NodePort
  selector:
    app: teemii-frontend
  ports:
    - port: 8080
      targetPort: 80
